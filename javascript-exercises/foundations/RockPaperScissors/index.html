<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="buttons">
        <button id="rock-btn" onclick="playRound('rock')">Rock</button>
        <button id="paper-btn" onclick="playRound('paper')">Paper</button>
        <button id="scissors-btn" onclick="playRound('scissors')">Scissors</button>
    </div>
    <div class="scores">
        <p>Player: <span id="player-score-el">0</span></p>
        <p>Computer: <span id="computer-score-el">0</span></p>
    </div>
    <div id="results-display-el">Choose your weapon to begin!</div>
</body>
<script src="script.js"></script>
</html>
